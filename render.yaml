services:
  - type: web
    name: futureface-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: MAX_GENERATIONS_PER_IP_HOUR
        value: "3"
      - key: MAX_GENERATIONS_PER_INSTANCE
        value: "30"
